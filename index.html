<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PandaToolkit</title>
<meta name="description" content="Raccolta di piccoli strumenti">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>">
<style>
:root{
  --bg:#f4f4f1; --surface:#fff; --line:#dcdcd5; --fg:#1b1c1a; --muted:#64665f; --accent:#2f6f5e;
  --f:"Segoe UI",system-ui,-apple-system,sans-serif; --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141514; --surface:#1d1f1d; --line:#30332f; --fg:#e8eae5; --muted:#9a9d95; --accent:#7cc4ad; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f);padding:32px 16px 48px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header h1{margin:0;font-size:clamp(28px,6vw,40px);letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--muted)}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--accent);transform:translateY(-1px);outline:none}
.card .t{font-weight:650;font-size:16px;display:flex;gap:8px;align-items:center}
.card .d{color:var(--muted);font-size:13.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.tags span{font:12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.empty{color:var(--muted)}
footer{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐼 PandaToolkit</h1>
    <p>Piccoli strumenti, una pagina ciascuno.</p>
  </header>
  <input type="search" id="q" placeholder="Cerca…" aria-label="Cerca uno strumento">
  <main class="grid" id="list"><p class="empty">Caricamento…</p></main>
  <footer>Ogni strumento gira interamente nel browser, niente dati inviati altrove.</footer>
</div>
<script>
const list = document.getElementById("list"), q = document.getElementById("q");
let tools = [];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
  const term = q.value.trim().toLowerCase();
  const shown = tools.filter(t => !term || [t.name, t.description, ...(t.tags||[])].join(" ").toLowerCase().includes(term));
  list.innerHTML = shown.length ? shown.map(t => `
    <a class="card" href="./${encodeURIComponent(t.slug)}/">
      <div class="t">${t.emoji ? esc(t.emoji) : ""}<span>${esc(t.name)}</span></div>
      <div class="d">${esc(t.description || "")}</div>
      ${t.tags?.length ? `<div class="tags">${t.tags.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
    </a>`).join("") : `<p class="empty">Nessuno strumento trovato.</p>`;
}
fetch("./tools.json", {cache: "no-cache"})
  .then(r => r.json())
  .then(d => { tools = d.sort((a, b) => a.name.localeCompare(b.name, "it")); render(); })
  .catch(() => { list.innerHTML = `<p class="empty">Impossibile leggere tools.json (aperto da file? usa un server locale).</p>`; });
q.addEventListener("input", render);
</script>
</body>
</html>
