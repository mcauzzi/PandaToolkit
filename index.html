<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PandaToolkit</title>
<meta name="description" content="Raccolta di piccoli strumenti">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>">
<link rel="stylesheet" href="./assets/panda.css">
<style>
/* Colori, font e blocchi comuni stanno in assets/panda.css */
:root{--wrap:880px}
.wrap{gap:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
a.card{gap:6px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--accent);transform:translateY(-1px);outline:none}
.card .t{font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center}
.card .d{color:var(--muted);font-size:13.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.empty{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐼 PandaToolkit</h1>
    <p>Piccoli strumenti, una pagina ciascuno.</p>
  </header>
  <div class="inp"><input type="search" id="q" placeholder="Cerca…" aria-label="Cerca uno strumento"></div>
  <main class="grid" id="list"><p class="empty">Caricamento…</p></main>
  <footer>Ogni strumento gira interamente nel browser, niente dati inviati altrove.</footer>
</div>
<script>
const list = document.getElementById("list"), q = document.getElementById("q");
let tools = [];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
  const term = q.value.trim().toLowerCase();
  const shown = tools.filter(t => !term || [t.name, t.description, ...(t.tags||[])].join(" ").toLowerCase().includes(term));
  list.innerHTML = shown.length ? shown.map(t => `
    <a class="card" href="./${encodeURIComponent(t.slug)}/">
      <div class="t">${t.emoji ? esc(t.emoji) : ""}<span>${esc(t.name)}</span></div>
      <div class="d">${esc(t.description || "")}</div>
      ${t.tags?.length ? `<div class="tags">${t.tags.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>` : ""}
    </a>`).join("") : `<p class="empty">Nessuno strumento trovato.</p>`;
}
fetch("./tools.json", {cache: "no-cache"})
  .then(r => r.json())
  .then(d => { tools = d.sort((a, b) => a.name.localeCompare(b.name, "it")); render(); })
  .catch(() => { list.innerHTML = `<p class="empty">Impossibile leggere tools.json (aperto da file? usa un server locale).</p>`; });
q.addEventListener("input", render);
</script>
</body>
</html>
