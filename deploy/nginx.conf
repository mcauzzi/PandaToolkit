server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Dietro il reverse proxy: il redirect /tool -> /tool/ deve restare relativo,
    # altrimenti nginx lo costruisce con http:// e la porta interna
    absolute_redirect off;

    # Niente nomi hashati: HTML e tools.json sempre rivalidati, così un deploy si vede subito
    location ~ \.(html|json)$ {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
