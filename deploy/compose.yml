# Stack Komodo "pandatoolkit".
# Variabile opzionale nell'Environment dello stack:
#   PORT  porta sull'host del NAS (default 8092; la 8090 sul NAS è già di Telegraf), quella a cui punta il reverse proxy
services:
  pandatoolkit:
    image: ghcr.io/mcauzzi/pandatoolkit:latest
    container_name: pandatoolkit
    restart: unless-stopped
    ports:
      - "${PORT:-8092}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
