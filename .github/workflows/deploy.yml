name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tools.json rotto = home vuota: meglio fermarsi qui
      - name: Valida tools.json
        run: |
          jq -e 'type == "array" and all(.[]; has("slug") and has("name"))' tools.json > /dev/null
          for s in $(jq -r '.[].slug' tools.json); do
            [ -f "$s/index.html" ] || { echo "::error::manca $s/index.html"; exit 1; }
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mcauzzi/pandatoolkit:latest
            ghcr.io/mcauzzi/pandatoolkit:${{ github.sha }}
